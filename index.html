<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riviera Majestica 1302</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#f5f2ed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Gujarati:wght@300;400;500;600&display=swap">
<style>
/* Layout: a calm Kota-stone ground, masonry board of cards, indigo (ajrakh) as the single accent, brass for must-haves. */
:root{
  /* Warm ivory ground, copper accent and hairline rules, in the spirit of the building's own finishes. */
  --bg:#f5f2ed; --surface:#ffffff; --sunk:#efebe4; --ink:#26211e; --muted:#7b716a; --line:#e5dfd6; --line-strong:#d3cbc0;
  --accent:#8f5e4b; --accent-ink:#ffffff; --accent-soft:#f3e8e2;
  --must:#8a6420; --must-soft:#f6eddb; --nice:#4d6a59; --nice-soft:#e6eee8; --avoid:#a3463a; --avoid-soft:#f7e3df;
  --star:#b8872a;
  --shadow:0 1px 2px rgb(38 33 30 / .04), 0 12px 32px -8px rgb(38 33 30 / .14);
  --shadow-sm:0 1px 2px rgb(38 33 30 / .05), 0 2px 8px -2px rgb(38 33 30 / .06);
  --display:"Jost", "Noto Sans Gujarati", "Avenir Next", "Century Gothic", system-ui, sans-serif;
  --body:"Inter", "Noto Sans Gujarati", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151312; --surface:#1d1a18; --sunk:#25211f; --ink:#ece6e0; --muted:#a39890; --line:#302b28; --line-strong:#423b37;
    --accent:#d39d86; --accent-ink:#1d1512; --accent-soft:#3a2a23;
    --must:#e0b96a; --must-soft:#372c18; --nice:#97c2a8; --nice-soft:#1f2d25; --avoid:#ec8f80; --avoid-soft:#3d231f;
    --star:#e3b75a;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -8px rgb(0 0 0 / .5);
    --shadow-sm:0 1px 2px rgb(0 0 0 / .3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.hint{color:var(--muted);font-size:13px;margin:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.spacer{flex:1}

/* Buttons and inputs */
.btn{font:500 14px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger,.btn.armed{background:var(--avoid);border-color:var(--avoid);color:var(--surface)}
.btn:disabled{opacity:.6;cursor:progress}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;flex:none}
.icon-btn:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface);flex-wrap:wrap}
.seg-btn{border:0;background:transparent;color:var(--muted);font:500 13px/1 var(--body);padding:7px 11px;border-radius:7px;cursor:pointer}
.seg-btn[aria-pressed="true"],.seg-btn[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg-btn.prio-must[aria-checked="true"]{background:var(--must);color:var(--surface)}
.seg-btn.prio-nice[aria-checked="true"]{background:var(--nice);color:var(--surface)}
.seg-btn.prio-avoid[aria-checked="true"]{background:var(--avoid);color:var(--surface)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:21;background:var(--bg)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:14px 10px;flex-wrap:wrap}
.brand{min-width:0;margin-right:auto}
.brand h1{font:600 clamp(22px,2.6vw,30px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.filters{display:grid;gap:10px;padding-block:0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px/1.4 var(--body);white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-row input[type=search]{flex:1 1 220px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:14px}
@media (max-width:720px){ header.top{position:static} .top-row .btn.ghost{padding:9px 10px} }

/* Board */
.grid{columns:330px;column-gap:18px;padding-block:20px 40px}
.grid.feed{columns:auto;max-width:560px;margin-inline:auto}
.card{break-inside:avoid;margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block}
.grid.feed .card{margin-bottom:28px}
.card[data-prio="avoid"] .media img{filter:grayscale(.65) opacity(.85)}
.media{display:block}
.media.img img{display:block;width:100%;height:auto;background:var(--sunk)}
.media.paper{background:#fff}
.img-missing{aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);background:var(--sunk);font-size:13px}
.ig{background:var(--surface);overflow:hidden}
.ig iframe{min-width:0!important;max-width:100%!important;border-radius:0!important;border:0!important;margin:0!important;box-shadow:none!important}
.ig .ig-loading{display:grid;place-items:center;aspect-ratio:4/5;color:var(--muted);font-size:13px;text-decoration:none;background:var(--sunk)}
.linkcard{display:grid;text-decoration:none;color:var(--ink);background:var(--sunk)}
.linkcard img{display:block;width:100%;height:auto}
.lc-host{padding:10px 14px;font-size:13px;color:var(--accent);font-weight:500;overflow-wrap:anywhere}
.lc-title{padding:0 14px 12px;font-size:14px}
.note-body{padding:18px 18px 6px;font:500 18px/1.45 var(--display);white-space:pre-wrap;overflow-wrap:anywhere}
.grid:not(.feed) .note-body{display:-webkit-box;-webkit-line-clamp:12;-webkit-box-orient:vertical;overflow:hidden}
.cbody{padding:12px 14px 14px;display:grid;gap:6px;cursor:pointer;border-top:1px solid var(--line)}
.card[data-kind="note"] .cbody{border-top:0}
.cbody:hover .ctitle{color:var(--accent)}
.cmeta{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prio{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.prio.must{background:var(--must-soft);color:var(--must)}
.prio.nice{background:var(--nice-soft);color:var(--nice)}
.prio.avoid{background:var(--avoid-soft);color:var(--avoid)}
.ctitle{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.cwhy{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.grid.feed .cwhy{display:block;-webkit-line-clamp:unset}
.cfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:60px 16px;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty h2{font:600 22px/1.2 var(--display);color:var(--ink);margin:0}
.foot{padding-block:10px 40px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgb(10 14 12 / .55);overflow-y:auto;padding:max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px));display:flex;justify-content:center;align-items:flex-start}
.panel{background:var(--surface);border-radius:14px;width:min(640px,100%);margin-top:3vh;box-shadow:var(--shadow);min-width:0}
.panel.wide{width:min(1060px,100%)}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font:600 19px/1.2 var(--display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.panel-body{padding:18px 20px 20px;display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stack{display:grid;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px/1 var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:4px}
.drop strong{color:var(--ink);font-weight:500}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative}
.thumb img{width:92px;height:92px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
.thumb .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1}
.sketch-prev{max-height:220px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* Detail */
.detail{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:780px){ .detail{grid-template-columns:minmax(0,1fr)} }
.d-media{display:grid;gap:12px;min-width:0}
.d-media .media.img img,.d-media .linkcard img{border-radius:8px}
.d-media .ig{border:1px solid var(--line);border-radius:8px}
.d-media .note-body{background:var(--sunk);border-radius:8px;padding:20px;font-size:20px}
.shot summary{cursor:pointer;color:var(--muted);font-size:13px}
.shot img{margin-top:8px;border-radius:8px;border:1px solid var(--line)}
.d-info{display:grid;gap:12px;min-width:0}
.d-title{font:600 24px/1.2 var(--display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.d-why{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.d-by{margin:0;color:var(--muted);font-size:13px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.comments{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.comments h3,.set h3{font:600 15px/1.3 var(--body);margin:0}
.c-item{background:var(--sunk);border-radius:8px;padding:9px 12px;display:grid;gap:3px}
.c-head{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.c-head strong{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.c-del{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline}
.c-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.c-form{display:grid;gap:8px;justify-items:end}
.c-form .form-actions{width:100%}
.c-form .c-tools{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mic.rec{background:var(--avoid);border-color:var(--avoid);color:var(--surface);font-variant-numeric:tabular-nums}
.clip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%}
.clip audio,.c-audio{width:100%;max-width:340px;height:40px}

/* Settings */
.set{display:grid;gap:10px}
.list{display:grid;gap:6px}
.list-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.list-row input{flex:1 1 160px}

/* Sketch pad */
.sketch{position:fixed;inset:0;z-index:70;background:var(--sunk);display:flex;flex-direction:column;padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)}
.sk-bar{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.sk-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sk-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:500 13px/1 var(--body);cursor:pointer}
.sk-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sz{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.sz span{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sk-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.sk-frame{position:relative;box-shadow:var(--shadow);background:#fff}
.sk-frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sk-frame canvas.ink{touch-action:none;cursor:crosshair}

/* Sign-in */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.signin-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
.signin-card h1{font:600 28px/1.15 var(--display);margin:0}
.signin-card .sub{margin:0;color:var(--muted)}
.signin-form{display:grid;gap:12px}

/* Sections, badges */
.nav{display:flex;gap:4px}
.nav-btn{border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--body);padding:9px 12px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-btn .n{font-weight:500;font-size:12px;opacity:.8}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--avoid);color:var(--surface);font:600 11px/18px var(--body);padding:0 5px;text-align:center}
.chip.new-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.new-pill{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px}
.banner.warn{background:var(--must-soft)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}

/* Floor plan */
.plan{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.plan-head{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.plan-head h2{font:600 16px/1.2 var(--display);margin:0}
.plan-body{padding:0 14px 14px;display:grid;justify-items:center}
.plan-box{position:relative;max-width:100%;line-height:0}
.plan-box img{display:block;max-width:100%;max-height:min(440px,60vh);width:auto;height:auto;border-radius:6px;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.zone{position:absolute;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:4px;cursor:pointer;padding:3px;margin:0;display:block;text-align:left;line-height:1.2;transition:background .15s,opacity .15s}
.zone .zl{display:inline-block;font:600 11px/1.3 var(--body);background:var(--surface);color:var(--ink);padding:2px 7px;border-radius:999px;box-shadow:0 1px 3px rgb(0 0 0 / .18);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.zone.has{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:var(--accent)}
.zone.none{opacity:.3}
.zone.on{background:color-mix(in srgb,var(--must) 28%,transparent);border:2.5px solid var(--must);opacity:1}
.zone.on .zl{background:var(--must);color:var(--surface)}
.zone:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.pe{position:fixed;inset:0;z-index:70;background:var(--sunk);display:flex;flex-direction:column;padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)}
.pe-rooms{padding:10px 14px;flex-wrap:wrap;overflow:visible}
.pe-stage{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:0 14px 14px}
.pe-box{touch-action:none;cursor:crosshair}
.pe-box img{max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px)}
.pe .zone{cursor:crosshair}
.zx{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px;line-height:1;padding:0}

/* Documents */
.docs{padding-block:20px 40px;display:grid;gap:14px;align-content:start}
.docs-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.docs-bar input[type=search]{flex:1 1 220px}
.doc-list{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.doc-ic{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;font:700 11px/1 var(--body);letter-spacing:.04em;background:var(--sunk);color:var(--muted);overflow:hidden;text-decoration:none}
.doc-ic img{width:100%;height:100%;object-fit:cover}
.doc-ic.pdf{background:var(--avoid-soft);color:var(--avoid)}
.doc-ic.cad{background:var(--accent-soft);color:var(--accent)}
.doc-ic.sheet{background:var(--nice-soft);color:var(--nice)}
.doc-ic.word{background:var(--must-soft);color:var(--must)}
.doc-main{display:grid;gap:2px;min-width:0}
.doc-name{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.doc-name:hover{color:var(--accent)}
.doc-meta{font-size:12px;color:var(--muted)}
.doc-note{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.doc-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){ .doc{grid-template-columns:40px minmax(0,1fr)} .doc-ic{width:40px;height:40px} .doc-acts{grid-column:1/-1;justify-content:flex-start} }

/* Comments: replies and mentions */
.c-thread{display:grid;gap:8px}
.c-replies{display:grid;gap:8px;margin-left:14px;padding-left:10px;border-left:2px solid var(--line)}
.c-head .acts{margin-left:auto;display:flex;gap:12px}
.c-act{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.mention{color:var(--accent);font-weight:600}
.composer{position:relative;width:100%}
.mention-pop{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;display:grid;max-height:220px;overflow:auto}
.mention-pop button{border:0;background:none;text-align:left;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:grid}
.mention-pop button small{color:var(--muted);font-size:12px}
.mention-pop button[aria-selected="true"]{background:var(--accent-soft)}
.fy{display:grid;gap:8px}
.fy-row{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:grid;gap:3px}
.fy-row.unread{border-color:var(--accent);background:var(--accent-soft)}
.fy-row .c-body{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Markups, covers, link previews */
.mk-grid{display:flex;gap:8px;flex-wrap:wrap}
.mk-grid button{border:1px solid var(--line);padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;width:96px;height:96px}
.mk-grid img{width:100%;height:100%;object-fit:cover;display:block}
.ig-cover{position:relative}
.ig-cover img{display:block;width:100%;height:auto;cursor:pointer;background:var(--sunk)}
.play{position:absolute;left:10px;bottom:10px;border:0;border-radius:999px;background:rgb(0 0 0 / .72);color:#fff;font:600 13px/1 var(--body);padding:9px 14px;cursor:pointer}
.yt{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.lc-desc{padding:0 14px 12px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lprev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:8px;padding:8px;align-items:center}
.lprev img{width:96px;height:72px;object-fit:cover;border-radius:6px;background:var(--sunk)}
.lprev p{margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* By-room overview */
.rooms-view{padding-block:20px 40px;display:grid;gap:26px}
.rv-head{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.rv-head h2{font:600 20px/1.2 var(--display);margin:0}
.rv-stats{display:flex;gap:6px;flex-wrap:wrap}
.rv-row{display:flex;gap:12px;overflow-x:auto;padding:10px 2px 6px;scroll-snap-type:x proximity}
.tile{flex:none;width:160px;scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;cursor:pointer;padding:0;text-align:left;font:inherit;color:var(--ink);display:grid;grid-template-rows:160px auto}
.tile:hover{border-color:var(--muted)}
.tile .tm{background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px}
.tile .tm img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tm.txt{padding:12px;font:500 13px/1.35 var(--display);color:var(--ink);place-items:start;white-space:pre-wrap;overflow-wrap:anywhere}
.tile[data-prio="avoid"] .tm img{filter:grayscale(.65) opacity(.85)}
.tile .tt{padding:8px 10px;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;min-width:0}
.tile .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.must{background:var(--must)} .dot.nice{background:var(--nice)} .dot.avoid{background:var(--avoid)}

/* Upvotes */
.cfoot{align-items:center}
.cf-left{display:inline-flex;gap:8px;align-items:center}
.vote{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font:600 12px/1.4 var(--body);cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.vote:hover{border-color:var(--accent);color:var(--accent)}
.vote[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vote.big{font-size:14px;padding:8px 14px;border-radius:8px}
.tile .tv{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.ai-tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px}

/* Colour palette tool */
.pal{position:fixed;inset:0;z-index:70;background:var(--sunk);display:flex;flex-direction:column;padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)}
.pal-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.pal-stage{display:grid;place-items:center;padding:16px;min-height:0;overflow:hidden}
.pal-stage svg{display:block;width:100%;height:auto;max-width:1100px;max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);border-radius:10px;box-shadow:var(--shadow);background:#fff}
.pal-side{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px;display:grid;gap:16px;align-content:start}
.pal-side h3{font:600 12px/1.3 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
@media (max-width:820px){
  .pal-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;overflow:auto}
  .pal-stage{padding:10px;overflow:visible}
  .pal-stage svg{max-height:42vh}
  .pal-side{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
.pp-list{display:grid;gap:2px}
.pp{display:flex;gap:10px;align-items:center;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.pp:hover{background:var(--sunk)}
.pp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pp i{width:26px;height:26px;border-radius:6px;border:1px solid rgb(0 0 0 / .15);flex:none}
.pp small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.sw-grid button{aspect-ratio:1;border-radius:8px;border:1px solid rgb(0 0 0 / .15);cursor:pointer;padding:0;min-width:0}
.sw-grid button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.pal-custom{display:flex;gap:8px;align-items:center;font-size:14px}
.pal-custom input[type=color]{width:44px;height:34px;padding:2px;border-radius:8px}
.pal-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.pal-thumbs button{width:52px;height:52px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--sunk)}
.pal-thumbs button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.pal-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pal-stage [data-part]{cursor:pointer}
.pal-stage .sel{stroke:#e0473a;stroke-width:4;stroke-dasharray:10 6}

/* AI: room briefs and suggestions */
.ai-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.ai{border-color:var(--accent);color:var(--accent)}
.btn.ai:disabled{cursor:progress}
.brief{display:grid;gap:16px}
.brief-ov{font:500 17px/1.5 var(--display);margin:0}
.brief h3{font:600 13px/1.3 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.brief ul{margin:0;padding-left:20px;display:grid;gap:4px}
.brief .b-must h3{color:var(--must)}
.brief .b-avoid h3{color:var(--avoid)}
.brief-meta{font-size:12px;color:var(--muted);margin:0}
.stale{background:var(--must-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.working{display:grid;gap:8px;justify-items:center;text-align:center;padding:30px 10px;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:3s} }

#toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:90;transition:opacity .2s, transform .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--avoid);color:var(--surface)}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }

/* ===== Finish: a calmer, more refined surface ===== */
body{font-size:14.5px;letter-spacing:-.003em}
::selection{background:var(--accent-soft)}
.btn{font:500 13.5px/1 var(--body);border-radius:8px;padding:9px 14px;border-color:var(--line-strong);transition:border-color .15s,background .15s,color .15s,box-shadow .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.btn.primary:hover{filter:none;background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk);border-color:transparent}
.btn.small{padding:7px 11px;font-size:12.5px}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
input,select,textarea{border-color:var(--line-strong);border-radius:8px;background:var(--surface)}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.seg{border-color:var(--line);background:var(--sunk);border-radius:9px;padding:3px}
.seg-btn{font-size:12.5px;padding:7px 12px}
.seg-btn[aria-pressed="true"],.seg-btn[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

header.top{background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom-color:var(--line)}
.top-row{padding-block:18px 12px;gap:6px 8px}
.brand h1{font:400 clamp(19px,2.1vw,24px)/1.1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.brand h1 .no{color:var(--accent);font-weight:500}
.brand p{font:500 10.5px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.nav{background:var(--sunk);border-radius:9px;padding:3px;margin-right:6px}
.nav-btn{font:500 13px/1 var(--body);padding:8px 13px;border-radius:7px}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.chip{border-color:var(--line);font-size:12.5px;padding:6px 13px;transition:border-color .15s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.count{font-size:12px;letter-spacing:.04em}
.banner{border-radius:10px;border:1px solid var(--line)}

.grid{column-gap:22px;padding-block:26px 48px}
.card{margin-bottom:22px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s,border-color .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card.pinned{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cbody{padding:14px 16px 14px;gap:8px;border-top-color:var(--line)}
.ctitle{font:500 16px/1.3 var(--display);letter-spacing:.005em}
.cbody:hover .ctitle{color:var(--ink)}
.cwhy{font-size:13.5px;line-height:1.5}
.note-body{font:400 17px/1.55 var(--display);padding:20px 20px 8px}
.grid:not(.feed) .note-body{-webkit-line-clamp:9}
.filter-row select,.filter-row input{font-size:13.5px;padding:7px 10px;height:36px}
.d-actions .btn.ghost{color:var(--avoid)}
@media (max-width:720px){ .brand{flex-basis:100%} }
.prio{font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:4px}
.new-pill,.pin-pill,.ai-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 7px}
.pin-pill{display:inline-flex;gap:4px;align-items:center;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.pin-ic{display:inline-flex}
.pin-ic svg{display:block}
.pin-pill .pin-ic svg{width:11px;height:11px}
.cfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.cf-right{display:inline-flex;gap:8px;align-items:center}
.pin-btn{border:0;background:none;color:var(--line-strong);cursor:pointer;padding:3px;border-radius:6px;display:inline-flex}
.pin-btn:hover{color:var(--accent);background:var(--accent-soft)}
.pin-btn[aria-pressed="true"]{color:var(--accent)}
.vote{border-color:var(--line);padding:3px 10px}
.vote.big{border-radius:8px;border-color:var(--line-strong)}

.overlay{background:rgb(24 20 18 / .5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.panel{border-radius:16px;border:1px solid var(--line)}
.panel-head{padding:16px 18px 16px 24px}
.panel-head h2{font:500 17px/1.25 var(--display);letter-spacing:.02em}
.panel-body{padding:22px 24px 24px;gap:18px}
.lbl{font-size:10.5px;letter-spacing:.12em;font-weight:600}
.d-title{font:500 26px/1.2 var(--display)}
.comments h3,.set h3{font:600 11px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.c-item{background:var(--sunk);border-radius:10px;padding:10px 14px}
.tab{border-color:var(--line-strong);font-size:13px}

.signin-card{border-radius:16px;padding:36px 32px;box-shadow:var(--shadow);gap:16px}
.signin-card h1{font:400 24px/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase}
.signin-card .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.empty h2,.rv-head h2,.plan-head h2{font-family:var(--display);font-weight:500;letter-spacing:.02em}
.tile{box-shadow:var(--shadow-sm)}
.doc{box-shadow:var(--shadow-sm)}
.foot{font-size:12px}

/* Interactive floor plan */
#board-sec.plan-mode{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:0 26px;align-items:start}
#board-sec.plan-mode .plan2d-wrap{grid-row:1 / span 2;position:sticky;top:calc(var(--hdr,0px) + 14px);margin-top:22px}
#board-sec.plan-mode #grid{columns:240px;column-gap:16px}
#board-sec.plan-mode #empty{grid-column:2}
@media (max-width:900px){ #board-sec.plan-mode{display:block} #board-sec.plan-mode .plan2d-wrap{position:static} }
.plan2d-wrap.collapsed{margin-top:16px;padding:8px 14px}
.plan2d-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:14px 16px 12px;display:grid;gap:10px}
.plan2d-head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.plan2d-head h2{font:500 15px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.p-sel{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;font-weight:500}
.p-x{border:0;background:rgb(255 255 255 / .18);color:inherit;width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1;padding:0}
.plan2d-stage{background:#fdfcfa;border-radius:8px;border:1px solid var(--line);overflow:hidden}
svg.plan2d{display:block;width:100%;height:auto;max-height:calc(100vh - var(--hdr,0px) - 190px);max-height:calc(100dvh - var(--hdr,0px) - 190px)}
.p-room{fill-opacity:.7;stroke:none;cursor:pointer;transition:fill-opacity .15s}
.p-room:hover,.p-room:focus-visible{fill-opacity:1;outline:none;stroke:#26211e;stroke-width:2.5}
.p-room.none{fill-opacity:.22}
.p-room.has{fill-opacity:.95}
.p-room.on{fill-opacity:1;stroke:#26211e;stroke-width:4}
.p-room.unlinked{fill-opacity:.4}
.p-room.still{cursor:default;fill-opacity:.5}
.z-public{fill:#ecd9c2;background:#ecd9c2} .z-dining{fill:#f2e2b8;background:#f2e2b8} .z-entry{fill:#e4ddd2;background:#e4ddd2}
.z-outdoor{fill:#d9e2c4;background:#d9e2c4} .z-service{fill:#f0cdb8;background:#f0cdb8} .z-service2{fill:#f3d8c8;background:#f3d8c8}
.z-puja{fill:#f3d98d;background:#f3d98d} .z-bed1{fill:#cfe0d1;background:#cfe0d1} .z-bed2{fill:#cfdbea;background:#cfdbea}
.z-bed3{fill:#efd3d6;background:#efd3d6} .z-bed4{fill:#ddd3ea;background:#ddd3ea} .z-wet{fill:#d6e6ec;background:#d6e6ec}
.z-staff{fill:#e3dfda;background:#e3dfda} .z-circ{fill:#eeebe6;background:#eeebe6}
.p-drawing{mix-blend-mode:multiply;pointer-events:none}
.p-labels{pointer-events:none}
.p-piece{cursor:pointer}
.p-piece rect{fill:transparent;stroke:transparent;stroke-width:2;transition:fill .15s,stroke .15s}
.p-piece:hover rect,.p-piece:focus-visible rect{fill:rgb(143 94 75 / .2);stroke:var(--accent)}
.p-piece:focus-visible{outline:none}
.p-piece.has rect{stroke:rgb(143 94 75 / .45);stroke-dasharray:6 4}
.p-piece.on rect{fill:rgb(143 94 75 / .32);stroke:#6e4434;stroke-width:3;stroke-dasharray:none}
.p-badge{fill:#26211e;opacity:.82}
.p-badge.link{fill:var(--accent)}
.p-badge-t{font:600 12px var(--body);fill:#fff}
/* On phones the plan keeps a readable size and scrolls sideways inside its frame.
   (This must come after the svg.plan2d rule above, or its height limit shrinks the drawing.) */
.p-swipe{display:none}
@media (max-width:700px){
  .plan2d-stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .plan2d-stage svg.plan2d{width:760px;min-width:760px;max-width:none;height:auto;max-height:none}
  .plan2d-wrap{padding:12px}
  .p-swipe{display:block}
}
.p-tip{position:fixed;z-index:90;pointer-events:none;background:#26211e;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;display:grid;gap:1px;box-shadow:var(--shadow);max-width:240px}
.p-tip strong{font-weight:600;font-size:13px}
.p-tip span{opacity:.78}
.p-legend{display:flex;flex-wrap:wrap;gap:4px 6px}
.p-key{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:999px;padding:3px 9px 3px 5px;font:500 12px/1.4 var(--body);color:var(--ink);cursor:pointer}
.p-key:hover{background:var(--sunk)}
.p-key[aria-pressed="true"]{border-color:var(--ink)}
.p-key i,.p-link i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.p-links{display:grid;gap:6px}
.p-link{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px);gap:10px;align-items:center;padding:4px 6px;border-radius:8px}
.p-link.focus{background:var(--accent-soft)}
.p-link span{display:inline-flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
.p-link small{color:var(--muted);font-size:12px}
@media (prefers-color-scheme: dark){ .plan2d-stage{filter:brightness(.88)} }
.room-pick{display:flex;gap:6px;flex-wrap:wrap}
.room-pick .chip.shortcut{border-style:dashed}
.dict-group{display:inline-flex;gap:0;align-items:stretch}
.dict-group .btn{border-top-right-radius:0;border-bottom-right-radius:0}
.dict-lang{font-size:12px;padding:5px 6px;border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;max-width:96px}
.dict-row{display:flex;gap:8px}
.mic.rec,.dict.rec{background:var(--avoid);border-color:var(--avoid);color:#fff;font-variant-numeric:tabular-nums}
@media (max-width:720px){ .nav{margin-right:0} .top-row{padding-block:14px 10px} }
/* ===== Curated: the final picks ===== */
.star-ic{display:inline-flex;color:var(--star)}
.star-ic svg{display:block}
.cur-seg .seg-btn{display:inline-flex;align-items:center;gap:5px}
.cur-seg .seg-btn .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cur-seg .seg-btn .n:empty{display:none}
.cur-seg .star-ic svg{width:13px;height:13px}
.cur-pill{display:inline-flex;gap:4px;align-items:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-radius:4px;padding:3px 7px;background:var(--ink);color:var(--bg)}
.cur-pill .star-ic svg{width:11px;height:11px}
.card.curated{border-color:color-mix(in srgb,var(--star) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--star) 30%,transparent),var(--shadow-sm)}
.cur-btn{border:0;background:none;color:var(--line-strong);cursor:pointer;padding:3px;border-radius:6px;display:inline-flex}
.cur-btn .star-ic{color:inherit}
.cur-btn:hover{color:var(--star);background:var(--sunk)}
.cur-btn[aria-pressed="true"]{color:var(--star)}
.btn.cur{display:inline-flex;gap:6px;align-items:center}

/* ===== Who's here ===== */
.presence{position:relative;display:flex;align-items:center}
.pres-stack{display:inline-flex;align-items:center;border:0;background:none;padding:2px 4px;cursor:pointer;border-radius:999px;position:relative}

@keyframes pres-pulse{50%{box-shadow:0 0 0 4px rgb(46 158 91/.18)}}

.pres-list{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:260px;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px}

.pres-row.away{opacity:.6}

.pres-empty{margin:6px 6px 2px;font-size:12.5px;color:var(--muted);line-height:1.45}
.card{position:relative}
.card .viewers{position:absolute;top:8px;left:8px;display:flex;z-index:2;filter:drop-shadow(0 1px 3px rgb(0 0 0/.25));pointer-events:auto}
.card .viewers .pres-av+.pres-av{margin-left:-6px}
.d-here{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:-2px 0 6px;flex-wrap:wrap}

.pres-list{max-height:min(72vh,560px);overflow:auto}

.pres-row .btn.small{flex:none}
.pres-foot{margin:10px 6px 2px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.d-seen{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-2px 0 6px}

.act{gap:6px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
"use strict";

/* ===================== SETTINGS: edit these ===================== */
const CONFIG = {
  // Leave both empty to try the board in demo mode (saved in this browser only).
  SUPABASE_URL: "https://bbbxjegctpvyxozgoxab.supabase.co",       // e.g. "https://abcdxyz.supabase.co"
  SUPABASE_KEY: "sb_publishable_vJ-hKFtRxbRpyG-wNH3Ogg_cpCzJDo8",       // the "publishable" (or legacy "anon public") key
  BOARD_TITLE: "Riviera Majestica 1302",
  BOARD_SUBTITLE: "Inspiration board for Urbannest Studio",
  STUDIO: "Urbannest Studio",
  TYPES: ["Furniture", "Embroidery / Textile", "Artwork", "Lighting", "Material / Finish",
          "Hardware / Fixture", "Layout idea", "Decor", "Other"],
};
/* ================================================================ */

const LIVE = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const DEFAULT_ROOMS = ["Living Room", "Dining", "Kitchen", "Pooja Room", "Master Bedroom", "Bedroom 2",
                       "Bedroom 3", "Bathrooms", "Entry / Foyer", "Balcony"];
const PRIO = { must: "Must-have", nice: "Nice-to-have", avoid: "Avoid" };
const PRIO_ORDER = { must: 0, nice: 1, avoid: 2 };
const KINDS = [["instagram", "Instagram"], ["image", "Photo"], ["sketch", "Sketch"], ["palette", "Palette"], ["link", "Link"], ["note", "Note"]];
const KIND_LABEL = Object.fromEntries(KINDS);
/* A colour palette is stored as a sketch card (its image) with the chosen colours in meta.palette. */
const kindOf = it => (it.kind === "sketch" && metaOf(it).palette ? "palette" : it.kind);

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "value") n.value = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false && c !== "") n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const errMsg = e => (e && (e.message || e.error_description)) || String(e);
const tsOf = i => Date.parse(i.created_at) || 0;
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function toast(msg, kind = "") {
  let t = $("#toast");
  if (!t) { t = el("div", { id: "toast", role: "status", "aria-live": "polite" }); document.body.append(t); }
  t.textContent = msg; t.className = "show " + kind;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), kind === "err" ? 5000 : 3000);
}
function fmtDate(s) { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString(LOCALE, { day: "numeric", month: "short", year: "numeric" }); }
function normUrl(u) {
  u = (u || "").trim(); if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { return new URL(u).href; } catch { return null; }
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } }
function igPermalink(u) {
  const m = String(u || "").match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i);
  if (!m) return null;
  const kind = m[1].toLowerCase() === "reels" ? "reel" : m[1].toLowerCase();
  return `https://www.instagram.com/${kind}/${m[2]}/`;
}
function titleOf(it) {
  if (it.title && it.title.trim()) return it.title.trim();
  if (it.kind === "instagram") return "Instagram post";
  if (it.kind === "link") return metaOf(it).preview?.title || hostOf(it.url) || "Link";
  if (it.kind === "note") return (it.note || "").split("\n")[0].slice(0, 80) || "Note";
  if (it.kind === "sketch") return metaOf(it).palette ? "Colour palette" : "Sketch";
  return "Photo";
}
function roomName(id) { return (id && S.rooms.find(r => r.id === id)?.name) || "Whole home"; }
/* A card can be filed under several rooms. room_id holds the first one and meta.rooms lists them all;
   a card with no rooms belongs to "Whole home". Rooms that were deleted are ignored. */
function roomsOf(it) {
  const m = metaOf(it).rooms, out = [];
  for (const id of [it.room_id, ...(Array.isArray(m) ? m : [])]) if (id && !out.includes(id) && S.rooms.some(r => r.id === id)) out.push(id);
  return S.rooms.filter(r => out.includes(r.id)).map(r => r.id); // in the board's room order
}
const inRoom = (it, id) => (id ? roomsOf(it).includes(id) : !roomsOf(it).length);
function roomsLabel(it, short) {
  const names = roomsOf(it).map(roomName);
  if (!names.length) return "Whole home";
  return short && names.length > 2 ? `${names[0]}, ${names[1]} +${names.length - 2}` : names.join(", ");
}
function typesList() { return [...new Set([...CONFIG.TYPES, ...S.items.map(i => i.type).filter(Boolean)])]; }
function prioBadge(p) { return el("span", { class: "prio " + p }, PRIO[p] || p); }
function imgUrl(it) { return it.image_path ? S.urls.get(it.image_path) || null : null; }
const metaOf = it => (it && it.meta && typeof it.meta === "object" && !Array.isArray(it.meta)) ? it.meta : {};
const myEmail = () => (S.user?.email || "").toLowerCase();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function nameOf(email) {
  if (!email) return "someone";
  const e = String(email).toLowerCase();
  const m = S.members.find(x => x.email === e);
  return (m && m.name && m.name.trim()) || String(email).split("@")[0];
}
function ytId(u) {
  const m = String(u || "").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function fmtWhen(s) {
  const d = new Date(s); if (isNaN(d)) return "";
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString(LOCALE, { hour: "numeric", minute: "2-digit" });
  return d.toLocaleDateString(LOCALE, { day: "numeric", month: "short", ...(d.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) });
}
function fmtSize(n) {
  if (!n && n !== 0) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / 1024 / 1024).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + " MB";
}
function safeName(n) { return (String(n || "file").normalize("NFKD").replace(/[^\w.\-]+/g, "_").replace(/_+/g, "_").slice(-100)) || "file"; }
function pickFile(accept, multiple) {
  return new Promise(res => {
    const i = el("input", { type: "file", accept: accept || null, multiple: multiple || null, hidden: true });
    const done = v => { res(v); i.remove(); };
    i.addEventListener("change", () => done([...i.files]));
    i.addEventListener("cancel", () => done([]));
    document.body.append(i); i.click();
  });
}
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("Timed out")), ms))]); }
/* Shrink a picture to at most 1280px JPEG before sending it to the AI. */
async function aiImage(src) {
  const blob = src instanceof Blob ? src : await (await fetch(src)).blob();
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
  const out = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(out); });
  return { media_type: "image/jpeg", data };
}
/* Columns added by update-2.sql are left out until that update has been run, so older databases keep working. */
function extras(obj) { return S.needsUpdate ? {} : obj; }

/* Link previews: the page title, description and cover image of any web link (via microlink.io's free API). */
async function fetchPreview(url) {
  try {
    const r = await withTimeout(fetch("https://api.microlink.io/?url=" + encodeURIComponent(url)), 10000);
    const j = await r.json();
    if (j.status !== "success" || !j.data) return null;
    const d = j.data;
    return { title: (d.title || "").slice(0, 200), description: (d.description || "").slice(0, 400), site: (d.publisher || "").slice(0, 80), image: d.image?.url || "" };
  } catch { return null; }
}
/* Download the cover image so the board keeps its own copy (and it can be drawn on). Falls back to an image proxy when the site blocks this. */
async function grabImage(src) {
  if (!src) return null;
  for (const u of [src, "https://wsrv.nl/?url=" + encodeURIComponent(src) + "&w=1600&we&output=jpg"]) {
    try {
      const r = await withTimeout(fetch(u), 12000); if (!r.ok) continue;
      const b = await r.blob();
      if (!/^image\//.test(b.type) || b.size < 500) continue;
      return b;
    } catch {}
  }
  return null;
}

async function prepareImage(file) {
  const type = file.type || "image/jpeg";
  const ext = ({ "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/heic": "heic", "image/heif": "heif" })[type] || "jpg";
  let out = { blob: file, ext };
  if (file.size > 1_500_000 && type !== "image/gif") {
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
      if (blob) out = { blob, ext: "jpg" };
    } catch { /* keep the original file */ }
  }
  out.preview = URL.createObjectURL(out.blob);
  return out;
}

/* ===================== DATA: Supabase ===================== */
class SupaStore {
  constructor() {
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    this.bucket = "moodboard";
  }
  async q(p) { const { data, error } = await p; if (error) throw error; return data; }
  async user() { const { data } = await this.sb.auth.getSession(); return data.session?.user || null; }
  onAuth(cb) { this.sb.auth.onAuthStateChange((_e, s) => cb(s?.user || null)); }
  async signIn(email) { await this.q(this.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } })); }
  async signOut() { await this.sb.auth.signOut(); }
  async isMember() { return !!(await this.q(this.sb.rpc("is_member"))); }
  rooms() { return this.q(this.sb.from("rooms").select("*").order("position").order("created_at")); }
  addRoom(name) { const max = Math.max(0, ...S.rooms.map(r => r.position || 0)); return this.q(this.sb.from("rooms").insert({ name, position: max + 1 })); }
  updateRoom(id, patch) { return this.q(this.sb.from("rooms").update(patch).eq("id", id)); }
  deleteRoom(id) { return this.q(this.sb.from("rooms").delete().eq("id", id)); }
  items() { return this.q(this.sb.from("items").select("*").order("created_at", { ascending: false })); }
  insertItems(rows) { return this.q(this.sb.from("items").insert(rows)); }
  updateItem(id, patch) { return this.q(this.sb.from("items").update(patch).eq("id", id)); }
  async deleteItem(it) { await this.q(this.sb.from("items").delete().eq("id", it.id)); if (it.image_path) this.removeFile(it.image_path); }
  async upload(blob, ext) {
    const path = `${new Date().toISOString().slice(0, 7)}/${uid()}.${ext}`;
    await this.q(this.sb.storage.from(this.bucket).upload(path, blob, { contentType: blob.type || undefined, cacheControl: "31536000" }));
    return path;
  }
  async urls(paths) {
    const data = await this.q(this.sb.storage.from(this.bucket).createSignedUrls(paths, 60 * 60 * 24 * 7));
    const m = new Map(); for (const d of data) if (d.signedUrl) m.set(d.path, d.signedUrl); return m;
  }
  async removeFile(path) { try { await this.sb.storage.from(this.bucket).remove([path]); } catch {} }
  comments() { return this.q(this.sb.from("comments").select("*").order("created_at")); }
  addComment(item_id, body, extra = {}) { return this.q(this.sb.from("comments").insert({ item_id, body, ...extra })); }
  deleteComment(id) { return this.q(this.sb.from("comments").delete().eq("id", id)); }
  voiceCheck() { return this.q(this.sb.from("comments").select("audio_path").limit(1)); }
  members() { return this.q(this.sb.from("members").select("*").order("added_at")); }
  addMember(email) { return this.q(this.sb.from("members").insert({ email })); }
  updateMember(email, patch) { return this.q(this.sb.from("members").update(patch).eq("email", email)); }
  removeMember(email) { return this.q(this.sb.from("members").delete().eq("email", email)); }
  documents() { return this.q(this.sb.from("documents").select("*").order("created_at", { ascending: false })); }
  addDocument(row) { return this.q(this.sb.from("documents").insert(row)); }
  updateDocument(id, patch) { return this.q(this.sb.from("documents").update(patch).eq("id", id)); }
  async deleteDocument(d) { await this.q(this.sb.from("documents").delete().eq("id", d.id)); this.removeFile(d.path); }
  async uploadFile(file) {
    const path = `docs/${uid()}/${safeName(file.name)}`;
    await this.q(this.sb.storage.from(this.bucket).upload(path, file, { contentType: file.type || "application/octet-stream" }));
    return path;
  }
  async settings() { const rows = await this.q(this.sb.from("settings").select("*")); return Object.fromEntries(rows.map(r => [r.key, r.value])); }
  setSetting(key, value) { return this.q(this.sb.from("settings").upsert({ key, value, updated_at: new Date().toISOString() })); }
  reactions() { return this.q(this.sb.from("reactions").select("item_id,email")); }
  react(item_id) { return this.q(this.sb.from("reactions").insert({ item_id })); }
  unreact(item_id) { return this.q(this.sb.from("reactions").delete().eq("item_id", item_id).eq("email", myEmail())); }
  async access() {
    const [ai, admin, users] = await Promise.all([this.sb.rpc("can_use_ai"), this.sb.rpc("is_admin"), this.sb.from("ai_users").select("email")]);
    if (ai.error || admin.error || users.error) throw ai.error || admin.error || users.error;
    return { ai: !!ai.data, admin: !!admin.data, aiUsers: (users.data || []).map(r => r.email) };
  }
  addAiUser(email) { return this.q(this.sb.from("ai_users").insert({ email })); }
  removeAiUser(email) { return this.q(this.sb.from("ai_users").delete().eq("email", email)); }
  /* Calls the "ai" Edge Function (supabase/functions/ai), which holds the Anthropic key. */
  async ai(body) {
    const { data, error } = await this.sb.functions.invoke("ai", { body });
    if (!error) return data;
    const res = error.context;
    if (res && typeof res.status === "number") {
      if (res.status === 404) throw new Error("The AI features aren't set up yet. See “AI features” in the README.");
      let msg = null; try { msg = (await res.json()).error; } catch {}
      throw new Error(msg || `The AI request failed (${res.status}).`);
    }
    throw new Error("Couldn't reach the AI service. Check your connection and try again.");
  }
  /** "Who's here" (needs update-6.sql). Everyone checks in; only owners can read last_seen and views. */
  async checkIn(m) {
    const { data, error } = await this.sb.rpc("check_in", { p_section: m.section, p_item: m.item, p_room: m.room, p_away: m.away, p_doc: m.doc || null });
    if (error) throw error;
    return data;   // the server's clock
  }
  seen() { return this.q(this.sb.from("last_seen").select("*")); }
  viewsBy(col, val) { return this.q(this.sb.from("views").select("email,item_id,doc_id,at").eq(col, val).order("at", { ascending: false }).limit(300)); }
  watchSeen(cb) {
    const ch = this.sb.channel("seen");
    ch.on("postgres_changes", { event: "*", schema: "public", table: "last_seen" }, p => p.new?.email && cb(p.new));
    ch.subscribe();
  }
  subscribe(cb, withUpdate) {
    const ch = this.sb.channel("board");
    const tables = ["items", "comments", "rooms", ...(withUpdate ? ["documents", "settings"] : []), ...(S.missing.has("update-3.sql") ? [] : ["reactions"])];
    for (const table of tables) ch.on("postgres_changes", { event: "*", schema: "public", table }, cb);
    ch.subscribe();
  }
}

/* ===================== DATA: demo (this browser only) ===================== */

class LocalStore {
  constructor() {
    this.key = "home-moodboard-demo-v1";
    try { const raw = localStorage.getItem(this.key); if (raw) this.db = JSON.parse(raw); } catch {}
    if (!this.db) this.db = seedDemo();
    this.fill();
  }
  fill() {
    const d = this.db;
    d.documents ||= []; d.settings ||= {}; d.reactions ||= [];
    d.members ||= [{ email: "you (demo)", name: "You" }, { email: "studio@example.com", name: "Urbannest (sample)" }];
  }
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.db)); } catch { toast("This browser ran out of demo storage. Connect Supabase to store images properly.", "err"); } }
  reset() { this.db = seedDemo(); this.fill(); this.save(); }
  async user() { return { id: "demo", email: "you (demo)" }; }
  onAuth() {} async signIn() {} async signOut() {}
  async isMember() { return true; }
  async rooms() { return [...this.db.rooms].sort((a, b) => a.position - b.position).map(r => ({ ...r })); }
  async addRoom(name) { const max = Math.max(0, ...this.db.rooms.map(r => r.position)); this.db.rooms.push({ id: uid(), name, position: max + 1 }); this.save(); }
  async updateRoom(id, patch) { const r = this.db.rooms.find(r => r.id === id); if (r) Object.assign(r, patch); this.save(); }
  async deleteRoom(id) { this.db.rooms = this.db.rooms.filter(r => r.id !== id); this.db.items.forEach(i => { if (i.room_id === id) i.room_id = null; }); this.save(); }
  async items() { return this.db.items.map(i => ({ ...i })); }
  async insertItems(rows) {
    for (const r of rows) {
      const t = r.created_at || new Date().toISOString();
      this.db.items.push({ id: uid(), url: null, image_path: null, note: "", title: "", type: null, room_id: null, priority: "nice", meta: {}, ...r, created_by: "you (demo)", created_at: t, updated_at: t });
    }
    this.save();
  }
  async updateItem(id, patch) { const it = this.db.items.find(i => i.id === id); if (it) Object.assign(it, patch, { updated_at: new Date().toISOString() }); this.save(); }
  async deleteItem(it) {
    this.db.items = this.db.items.filter(i => i.id !== it.id);
    this.db.reactions = this.db.reactions.filter(r => r.item_id !== it.id);
    this.db.comments = this.db.comments.filter(c => c.item_id !== it.id);
    if (it.image_path) delete this.db.files[it.image_path];
    this.save();
  }
  async upload(blob, ext) {
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    const path = `local/${uid()}.${ext}`; this.db.files[path] = data; this.save(); return path;
  }
  async urls(paths) { return new Map(paths.filter(p => this.db.files[p]).map(p => [p, this.db.files[p]])); }
  async removeFile(p) { delete this.db.files[p]; this.save(); }
  async comments() { return this.db.comments.map(c => ({ ...c })); }
  async addComment(item_id, body, extra = {}) { this.db.comments.push({ id: uid(), item_id, body, mentions: [], parent_id: null, ...extra, author: "you (demo)", created_at: new Date().toISOString() }); this.save(); }
  async deleteComment(id) {
    const gone = new Set([id]);
    this.db.comments.forEach(c => { if (gone.has(c.parent_id)) gone.add(c.id); });
    this.db.comments = this.db.comments.filter(c => !gone.has(c.id)); this.save();
  }
  async voiceCheck() { return []; }
  async members() { return this.db.members.map(m => ({ ...m })); }
  async addMember() { throw new Error("Inviting people needs Supabase. Follow the README to connect it."); }
  async updateMember(email, patch) { const m = this.db.members.find(x => x.email === email); if (m) Object.assign(m, patch); this.save(); }
  async removeMember() {}
  async documents() { return [...this.db.documents].sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at)).map(d => ({ ...d })); }
  async addDocument(row) { this.db.documents.push({ id: uid(), note: "", room_id: null, ...row, uploaded_by: "you (demo)", created_at: new Date().toISOString() }); this.save(); }
  async updateDocument(id, patch) { const d = this.db.documents.find(x => x.id === id); if (d) Object.assign(d, patch); this.save(); }
  async deleteDocument(d) { this.db.documents = this.db.documents.filter(x => x.id !== d.id); delete this.db.files[d.path]; this.save(); }
  async uploadFile(file) {
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const path = `local/docs/${uid()}/${safeName(file.name)}`; this.db.files[path] = data; this.save(); return path;
  }
  async settings() { return JSON.parse(JSON.stringify(this.db.settings)); }
  async setSetting(key, value) { this.db.settings[key] = value; this.save(); }
  async ai() { throw new Error("The AI features need the live board (Supabase), not demo mode."); }
  async reactions() { return [...this.db.reactions]; }
  async react(item_id) { if (!this.db.reactions.some(r => r.item_id === item_id && r.email === "you (demo)")) this.db.reactions.push({ item_id, email: "you (demo)" }); this.save(); }
  async unreact(item_id) { this.db.reactions = this.db.reactions.filter(r => !(r.item_id === item_id && r.email === "you (demo)")); this.save(); }
  async access() { return { ai: false, admin: true, aiUsers: [] }; }
  async addAiUser() { throw new Error("AI access needs the live board."); }
  async removeAiUser() {}
  async checkIn() { return null; }
  async seen() { return []; }
  async viewsBy() { return []; }
  watchSeen() {}
  subscribe() {}
}

const S = {
  store: null, user: null, ready: false, subscribed: false,
  rooms: [], items: [], boardItems: [], comments: [], members: [], docs: [], settings: {},
  byId: new Map(), ccount: new Map(), markups: new Map(), urls: new Map(),
  nodes: new Map(), pendingIG: new Set(), needsUpdate: false, missing: new Set(), newSince: 0,
  votes: new Map(), access: { ai: false, admin: false, aiUsers: [] }, lastOrder: null, orderStale: false,
  filter: { room: "all", type: "all", prio: "all", q: "", newOnly: false, spot: null, cur: "curated" },
  docFilter: { room: "all", q: "" },
  sort: ["newest", "oldest", "priority", "room", "votes"].includes(lsGet("mb-sort")) ? lsGet("mb-sort") : "votes", view: ["feed", "rooms"].includes(lsGet("mb-view")) ? lsGet("mb-view") : "board",
  section: lsGet("mb-section") === "docs" ? "docs" : "board",
  planOpen: lsGet("mb-plan") !== "closed",
  stack: [], overlays: {}, detailId: null, detailVer: null, ed: null, replyOpen: null,
};

async function boot() {
  if (LIVE && !window.supabase) return renderError(new Error("The Supabase library didn't load. Check your internet connection and reload."));
  try { S.store = LIVE ? new SupaStore() : new LocalStore(); } catch (e) { return renderError(e); }
  try { S.user = await S.store.user(); } catch (e) { return renderError(e); }
  S.store.onAuth(u => { if ((u?.id || null) !== (S.user?.id || null)) { S.user = u; gate(); } });
  gate();
}

async function gate() {
  S.ready = false;
  if (!S.user) return renderSignIn();
  let ok;
  try { ok = await S.store.isMember(); } catch (e) { return renderError(e); }
  if (!ok) return renderNotMember();
  if (!S.newSince) {
    const key = "mb-last-visit:" + myEmail();
    S.newSince = +lsGet(key) || Date.now();
    lsSet(key, String(Date.now()));
  }
  renderShell();
  S.ready = true;
  await refresh();
  if (!S.subscribed) { S.store.subscribe(debounce(() => S.ready && refresh(), 400), !S.needsUpdate); S.subscribed = true; }
  startPresence();
  openShared();
}

async function refresh() {
  try {
    const st = S.store;
    let missing = false, missing3 = false, missing4 = false;
    const soft = (p, fallback) => p.catch(() => { missing = true; return fallback; });
    const soft3 = (p, fallback) => p.catch(() => { missing3 = true; return fallback; });
    const [, rooms, items, comments, members, docs, settings, reactions, access] = await Promise.all([
      st.voiceCheck().catch(() => { missing4 = true; }),
      st.rooms(), st.items(), st.comments(), st.members().catch(() => []), soft(st.documents(), []), soft(st.settings(), {}),
      soft3(st.reactions(), []), soft3(st.access(), { ai: false, admin: false, aiUsers: [] })]);
    S.needsUpdate = LIVE && missing;
    S.missing = new Set([...(S.needsUpdate ? ["update-2.sql"] : []), ...(LIVE && missing3 ? ["update-3.sql"] : []), ...(LIVE && missing4 ? ["update-4.sql"] : []),
      ...(S.activityMissing && access.admin ? ["update-6.sql"] : [])]);
    S.access = access;
    const oldVotes = S.votes;
    S.votes = new Map();
    for (const r of reactions) { if (!S.votes.has(r.item_id)) S.votes.set(r.item_id, []); S.votes.get(r.item_id).push(r.email); }
    if (S.sort === "votes" && [...S.votes.keys(), ...oldVotes.keys()].some(id => (S.votes.get(id)?.length || 0) !== (oldVotes.get(id)?.length || 0))) S.orderStale = true;
    S.rooms = rooms; S.items = items; S.comments = comments; S.members = members || []; S.docs = docs || []; S.settings = settings || {};
    S.byId = new Map(items.map(i => [i.id, i]));
    S.ccount = new Map(); comments.forEach(c => S.ccount.set(c.item_id, (S.ccount.get(c.item_id) || 0) + 1));
    // A markup is a sketch attached to another item: it shows inside that item, not as its own card.
    S.markups = new Map();
    for (const i of items) { const p = metaOf(i).markup_of; if (p && S.byId.has(p)) { if (!S.markups.has(p)) S.markups.set(p, []); S.markups.get(p).push(i); } }
    S.boardItems = items.filter(i => !(metaOf(i).markup_of && S.byId.has(metaOf(i).markup_of)));
    const need = [...new Set([...items.map(i => i.image_path), ...S.docs.map(d => d.path), ...comments.map(c => c.audio_path), planData()?.path, planLayout()?.image_path].filter(p => p && !S.urls.has(p)))];
    if (need.length) (await st.urls(need)).forEach((u, p) => S.urls.set(p, u));
    renderBanner();
    renderFilters();
    renderPlan();
    renderGrid();
    renderDocs();
    updateForYou();
    document.querySelectorAll(".overlay [data-vote]").forEach(paintVote);
    if (S.detailId) { renderDetail(false); paintPresence(); }
    backfillPreviews();
  } catch (e) { toast("Couldn't load the board: " + errMsg(e), "err"); }
}

/* Older link cards get their preview the first time someone opens the board (a few at a time). */
async function backfillPreviews() {
  if (S.backfilling || S.needsUpdate) return;
  S.triedPreview ||= new Set();
  const todo = S.items.filter(i => i.kind === "link" && !i.image_path && !metaOf(i).preview_tried && !ytId(i.url) && !S.triedPreview.has(i.id)).slice(0, 4);
  if (!todo.length) return;
  S.backfilling = true;
  try {
    for (const it of todo) {
      S.triedPreview.add(it.id);
      const meta = { ...metaOf(it), preview_tried: true };
      const patch = {};
      const pv = await fetchPreview(it.url);
      if (pv) {
        meta.preview = { title: pv.title, description: pv.description, site: pv.site };
        const b = await grabImage(pv.image);
        if (b) { const p = await prepareImage(b); patch.image_path = await S.store.upload(p.blob, p.ext); }
      }
      patch.meta = meta;
      await S.store.updateItem(it.id, patch);
    }
    await refresh();
  } catch {} finally { S.backfilling = false; }
}

  else if (S.sort === "priority") a.sort((x, y) => (PRIO_ORDER[x.priority] - PRIO_ORDER[y.priority]) || newest(x, y));
  else if (S.sort === "votes") a.sort((x, y) => (voteCount(y) - voteCount(x)) || (PRIO_ORDER[x.priority] - PRIO_ORDER[y.priority]) || newest(x, y));
  else if (S.sort === "room") {
    const pos = id => (id ? S.rooms.find(r => r.id === id)?.position ?? 9999 : -1);
    a.sort((x, y) => (pos(roomsOf(x)[0]) - pos(roomsOf(y)[0])) || newest(x, y));

function gridOrder() {

    const pos = new Map(prev.map((id, k) => [id, k]));

function renderGrid() {

  const order = gridOrder();
  $("#resort").hidden = !(S.sort === "votes" && S.orderStale);
  const ids = new Set(order.map(i => i.id));
  for (const [id, node] of S.nodes) if (!ids.has(id)) { node.remove(); S.nodes.delete(id); }
  let cursor = grid.firstElementChild;
  for (const it of order) {
    const ver = itemVer(it);
    let node = S.nodes.get(it.id);
    if (node && node.dataset.ver !== ver) {
      const fresh = cardNode(it); fresh.dataset.ver = ver;
      if (cursor === node) cursor = fresh;
      node.replaceWith(fresh); node = fresh; S.nodes.set(it.id, fresh);
    }
    if (!node) { node = cardNode(it); node.dataset.ver = ver; S.nodes.set(it.id, node); }
    if (node === cursor) cursor = cursor.nextElementSibling;
    else grid.insertBefore(node, cursor);

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  let rec = null, clip = null, timer = 0;

    const tick = () => {
      if (!form.isConnected) { r.stop(); return; } // the box was closed while recording
      const sec = Math.floor((Date.now() - t0) / 1000);
      mic.textContent = `■ Stop ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
      if (sec >= 300) r.stop(); // five minutes at most
    };
    tick(); timer = setInterval(tick, 500);
  }
  ta.addEventListener("click", scan);
  ta.addEventListener("blur", () => setTimeout(hide, 150));
  ta.addEventListener("keydown", e => {
    if (!pop.hidden && opts.length) {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % opts.length; scan(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + opts.length) % opts.length; scan(); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pick(sel); return; }
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hide(); return; }
    }
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); }
  });
  const form = el("form", { class: "c-form" + (parentId ? " reply-form" : ""), onsubmit: async e => {
    e.preventDefault(); const body = ta.value.trim(); if (!body && !clip) return;
    if (rec) { toast("Stop the recording first."); return; }
    btn.disabled = true;
    const low = body.toLowerCase();
    const mentions = people().filter(m => low.includes("@" + nameOf(m.email).toLowerCase()) || low.includes("@" + m.email)).map(m => m.email);
    try {
      let audio = null;
      if (clip) {
        btn.textContent = "Uploading voice note…";
        const t = clip.type || "";
        audio = await S.store.upload(clip, t.includes("mp4") || t.includes("m4a") || t.includes("aac") ? "m4a" : t.includes("ogg") ? "ogg" : "webm");
      }
      await S.store.addComment(it.id, body, { ...extras({ parent_id: parentId, mentions }), ...(audio ? { audio_path: audio } : {}) });
      ta.value = ""; onText?.(""); setClip(null); onDone?.();
      if (parentId) ta.blur(); // lets the thread redraw with the new reply
      await refresh();
      if (mentions.length) toast(`Tagged ${mentions.map(nameOf).join(", ")}. They'll see it under “For you”.`);
    } catch (err) { toast(errMsg(err), "err"); }
    btn.disabled = false; btn.textContent = parentId ? "Reply" : "Post comment";
  } },
    el("div", { class: "composer" }, ta, pop),
    clipBox,
    el("div", { class: "form-actions" }, el("span", { class: "c-tools" }, dictateControls(ta), mic),
      onCancel ? el("button", { type: "button", class: "btn small ghost", onclick: () => { if (rec) rec.stop(); setClip(null); onCancel(); } }, "Cancel") : null, btn));
  return form;
}

/* Anyone can scribble on any post. The drawing is saved as a markup attached to that post. */
async function drawOn(it) {
  const target = S.byId.get(metaOf(it).markup_of) || it;
  let url = imgUrl(it);
  if (!url && (it.kind === "instagram" || it.kind === "link")) {
    toast("Choose a screenshot of the post (or of the slide you mean) to draw on.");
    const [f] = await pickFile("image/*");
    if (!f) return;
    const p = await prepareImage(f);
    url = p.preview;
    // Keep that screenshot on the post too, as its backup image.
    S.store.upload(p.blob, p.ext).then(path => S.store.updateItem(it.id, { image_path: path })).then(refresh).catch(() => {});
  }
  const blob = await openSketch({ bgUrl: url || null });
  if (!blob) return;
  try {
    const path = await S.store.upload(blob, blob.type === "image/png" ? "png" : "jpg");
    await S.store.insertItems([{ kind: "sketch", title: "Markup: " + titleOf(target), note: "", room_id: roomsOf(target)[0] || null, type: target.type, priority: target.priority,
      image_path: path, created_at: new Date().toISOString(), ...extras({ meta: { markup_of: target.id } }) }]);
    toast(S.needsUpdate ? "Markup added as a new card" : "Markup saved with this post"); await refresh();
  } catch (e) { toast(errMsg(e), "err"); }
}

function dropzone({ multiple, label, onFiles }) {

    onchange: () => { const fs = [...input.files]; input.value = ""; if (fs.length) onFiles(fs); } });
  const dz = el("div", { class: "drop", tabindex: "0", role: "button",
    onclick: () => input.click(),
    onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } },
    ondragover: e => { e.preventDefault(); dz.classList.add("over"); },
    ondragleave: () => dz.classList.remove("over"),
    ondrop: e => { e.preventDefault(); e.stopPropagation(); dz.classList.remove("over");
      const fs = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/")); if (fs.length) onFiles(fs); } },
    el("strong", {}, label), el("span", { class: "hint" }, "Click to choose, drag files here, or paste (Ctrl/⌘ + V)"), input);

}

function openEditor({ item = null, kind = null, files = null, text = "" } = {}) {

  paintRooms();

  // Optional: the piece of furniture on the floor plan this card is about.
  let fSpot = null;
  const PLAN = planLayout();
  if (PLAN) {
    const seen = new Set();
    fSpot = el("select", { id: "e-spot" }, el("option", { value: "" }, "Not on the plan"),
      ...PLAN.rooms.map(r => {
        const ps = PLAN.pieces.filter(p => p.room === r.id && !seen.has(p.id) && seen.add(p.id));

  let prio = item?.priority || "nice";

      onclick: () => { prio = k; prioSeg.querySelectorAll(".seg-btn").forEach(b => b.setAttribute("aria-checked", String(b.dataset.p === k))); } }, l)));
  const fWhy = el("textarea", { id: "e-why", rows: 3, placeholder: "What do you like about it? Colour, proportions, the carving, the fabric…" });
  fWhy.value = item && item.kind !== "note" ? item.note || "" : "";
  const whyField = field("Why I like it", fWhy);
  { const d = dictateControls(fWhy); if (d) whyField.append(el("div", { class: "dict-row" }, d)); }
  const kindBox = el("div", { class: "stack" });
  const tabs = isEdit ? null : el("div", { class: "tabs", role: "tablist", "aria-label": "What are you adding?" },
    ...KINDS.map(([k, l]) => el("button", { type: "button", role: "tab", class: "tab", "data-k": k, "aria-selected": String(ed.kind === k), onclick: () => setKind(k) }, l)));
  const fCur = el("input", { type: "checkbox", id: "e-cur" });

  const saveLabel = isEdit ? "Save changes" : "Add to board";
  const saveBtn = el("button", { class: "btn primary", type: "submit" }, saveLabel);
  const aiBtn = el("button", { type: "button", class: "btn small ai", onclick: () => suggest() }, "✨ Suggest details");
  const aiRow = el("div", { class: "ai-row" }, aiBtn, el("span", { class: "hint" }, "AI fills in the empty fields below from the picture."));
  const form = el("form", { class: "panel-body", onsubmit: e => { e.preventDefault(); save(); } },
    tabs, kindBox, aiRow, field("Title", fTitle),
    field("Rooms", fRoom, "Pick one or more. Nothing picked means Whole home."),
    fSpot ? field("On the floor plan (optional)", fSpot, "The piece of furniture this is for, so it shows when someone clicks it on the plan.") : null,
    el("div", { class: "row2" }, field("Type", fType)),

    panelHead(isEdit ? "Edit " + KIND_LABEL[ed.kind].toLowerCase() : "Add to the board", () => closeOverlay("editor")), form), { backdropCloses: false });

  function setKind(k) {
