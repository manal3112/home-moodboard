  /* Ask the AI for a title, room, type and "why I like it", filling only the fields that are still empty. */
  async function suggest() {
    aiBtn.disabled = true; aiBtn.textContent = "Looking…";
    try {
      const existing = isEdit && !ed.removeImage && item.image_path ? S.urls.get(item.image_path) : null;
      let src = ed.kind === "image" ? (ed.files[0]?.blob || existing)
        : ed.kind === "sketch" ? (ed.sketch?.blob || existing)
        : (ed.shot?.blob || existing);
      if (!src && ed.kind === "link") {
        if (ed.previewFor !== normUrl(ed.urlInput.value)) await ed.loadPv();
        src = await ed.previewImg.catch(() => null);
      }
      if (!src && ed.kind === "instagram") throw new Error("The AI can't see inside Instagram posts. Add a screenshot of the post first, then try again.");
      if (!src && ed.kind !== "link") throw new Error("Add the picture first, then try again.");
      const image = src ? await aiImage(src).catch(() => null) : null;
      const context = [
        `Kind: ${KIND_LABEL[ed.kind]}`,
        ed.kind === "instagram" ? `Instagram link: ${ed.igInput.value.trim().split(/\s+/)[0]}` : null,
        ed.kind === "link" ? `Link: ${ed.urlInput.value.trim()}` : null,
        ed.kind === "link" && ed.preview ? `Page title: ${ed.preview.title}\nPage description: ${ed.preview.description}` : null,
        fTitle.value.trim() ? `Title we gave it: ${fTitle.value.trim()}` : null,
        fWhy.value.trim() ? `Our note: ${fWhy.value.trim()}` : null,
      ].filter(Boolean).join("\n");
      const r = await S.store.ai({ action: "autofill", image, context, rooms: S.rooms.map(x => x.name), types: typesList() });
      if (!S.ed || S.ed !== ed) return; // the form was closed meanwhile
      const filled = [];
      if (r.title && !fTitle.value.trim()) { fTitle.value = r.title; filled.push("title"); }
      const room = S.rooms.find(x => x.name.toLowerCase() === String(r.room || "").toLowerCase());
      if (room && !picked.size) { picked.add(room.id); paintRooms(); filled.push("room"); }
      const type = typesList().find(t => t.toLowerCase() === String(r.type || "").toLowerCase());
      if (type && !fType.value) { fType.value = type; filled.push("type"); }
      if (r.why && !fWhy.value.trim()) { fWhy.value = r.why; filled.push("why I like it"); }
      toast(filled.length ? `Filled in ${filled.join(", ")}. Check it before saving.` : `Every field already had something, so nothing changed. Suggested title: “${r.title}”.`);
    } catch (e) { toast(errMsg(e), "err"); }

  function singleImage(label, existingPath) {

  function kindSection(k) {

      ed.igInput = inp;
      const cover = el("input", { type: "checkbox", id: "e-cover" });
      cover.checked = metaOf(item).cover === "shot";
      ed.coverCb = cover;
      return el("div", { class: "stack" },
        field(isEdit ? "Instagram link" : "Instagram link(s)", inp, isEdit ? null : "Paste one link, or several (one per line) to add them all at once. Only posts from public accounts can be shown."),
        singleImage("Screenshot (optional)", isEdit ? item.image_path : null),
        el("label", { class: "check", for: "e-cover" }, cover, "Show the screenshot as the cover on the board"),
        el("p", { class: "hint" }, "For a carousel, screenshot the photo you want people to see first (say photo 4) and tick the box. Clicking the cover still plays the live post. Without the box ticked, the screenshot only appears if the post is deleted or made private."));
    }
    if (k === "image") {
      if (isEdit) return singleImage("Image", item.image_path);
      const thumbs = el("div", { class: "thumbs" });
      const draw = () => thumbs.replaceChildren(...ed.files.map((f, i) => el("div", { class: "thumb" }, el("img", { src: f.preview, alt: "" }),
        el("button", { type: "button", class: "x", "aria-label": "Remove image", onclick: () => { ed.files.splice(i, 1); draw(); } }, "×"))));
      ed.onFiles = async fs => { for (const f of fs) ed.files.push(await prepareImage(f)); draw(); };
      return el("div", { class: "stack" },
        dropzone({ multiple: true, label: "Add photos or screenshots", onFiles: ed.onFiles }), thumbs,
        el("p", { class: "hint" }, "Furniture you spotted, embroidery, artwork, a screenshot from anywhere. Each image becomes its own card."));
    }
    if (k === "sketch") {
      const prev = el("div", { class: "thumbs" });
      const current = () => ed.sketch ? ed.sketch.preview : (isEdit ? S.urls.get(item.image_path) : null);
      const btn = el("button", { type: "button", class: "btn" }, current() ? "Edit sketch" : "Open sketch pad");
      const show = () => { const src = current(); prev.replaceChildren(src ? el("img", { src, alt: "Sketch preview", class: "sketch-prev" }) : el("p", { class: "hint" }, "No sketch yet.")); btn.textContent = src ? "Edit sketch" : "Open sketch pad"; };
      btn.addEventListener("click", async () => {

      });

    if (k === "palette") {

      const btn = el("button", { type: "button", class: "btn" });
      const show = () => { const src = current(); prev.replaceChildren(src ? el("img", { src, alt: "Palette preview", class: "sketch-prev" }) : el("p", { class: "hint" }, "No palette yet.")); btn.textContent = src ? "Edit palette" : "Open palette tool"; };
      btn.addEventListener("click", async () => {
        const res = await openPalette(ed.palette?.data || (isEdit ? metaOf(item).palette : null));
        if (res) { ed.palette = res; show(); if (!fTitle.value.trim()) fTitle.value = "Colour palette"; }
      });
      show();
      return el("div", { class: "stack" }, el("div", {}, btn), prev,
        el("p", { class: "hint" }, "Try colours for walls, floor, furniture and fabrics on an illustrated room. You can pull colours from photos on the board. The palette is saved as a card that people can upvote and comment on."));
    }
    if (k === "link") {

      ed.urlInput = u;
      const pvBox = el("div", { "aria-live": "polite" });
      ed.preview = isEdit ? metaOf(item).preview || null : null;
      ed.previewFor = isEdit ? item.url : null;
      ed.previewImg = Promise.resolve(null);
      ed.loadPv = async () => {
        const v = normUrl(u.value);
        if (!v || v === ed.previewFor) return;
        ed.previewFor = v; ed.preview = null; ed.previewImg = Promise.resolve(null);
        if (ytId(v)) { pvBox.replaceChildren(el("p", { class: "hint" }, "YouTube video: it will play right on the card.")); return; }
        pvBox.replaceChildren(el("p", { class: "hint" }, "Fetching a preview…"));
        const pv = await fetchPreview(v);
        if (ed.previewFor !== v) return;
        ed.preview = pv;
        if (!pv || (!pv.title && !pv.image)) { pvBox.replaceChildren(el("p", { class: "hint" }, "No preview available for this site. You can add a picture below.")); return; }
        ed.previewImg = grabImage(pv.image);
        if (pv.title) fTitle.placeholder = pv.title;
        pvBox.replaceChildren(el("div", { class: "lprev" },
          pv.image ? el("img", { src: pv.image, alt: "", referrerpolicy: "no-referrer" }) : el("span"),
          el("div", {}, el("strong", {}, pv.title || hostOf(v)), pv.description ? el("p", { class: "hint" }, pv.description) : null)));
      };
      u.addEventListener("change", ed.loadPv);
      u.addEventListener("input", debounce(ed.loadPv, 700));
      return el("div", { class: "stack" },
        field("Link", u, "A shop, a maker, a Pinterest pin, a YouTube video: anything with a web address. The page's picture and title are fetched automatically."),
        pvBox,

    ed.noteInput = n;
    const nf = field("Note", n), d = dictateControls(n);
    if (d) nf.append(el("div", { class: "dict-row" }, d));

  async function save() {
    const rooms = roomList();
    const base = { title: fTitle.value.trim(), room_id: rooms[0] || null, type: fType.value || null, priority: prio };
    const spot = fSpot?.value || "";
    const withRooms = meta => {
      const m = { ...meta };
      if (!fCur.checked) delete m.curated;
      else if (!m.curated) m.curated = { by: myEmail(), at: new Date().toISOString() };
      if (rooms.length > 1) m.rooms = rooms; else delete m.rooms;
      if (spot) m.spots = [spot]; else delete m.spots;
      return m;
    };
    if (rooms.length > 1 && S.needsUpdate) { toast("Run update-2.sql in Supabase first to use several rooms (see the banner).", "err"); return; }
    const why = fWhy.value.trim();
    const st = S.store;
    const up = async p => (p ? await st.upload(p.blob, p.ext) : null);
    saveBtn.disabled = true; saveBtn.textContent = "Saving…";
    // For links: the fetched page preview, and its picture when the card has no picture of its own.
    const linkExtras = async (u, keepsImage) => {
      if (ytId(u)) return { meta: { preview_tried: true }, img: null };
      if (ed.previewFor !== u) await ed.loadPv();
      const meta = { preview_tried: true };
      if (ed.preview && ed.previewFor === u) meta.preview = { title: ed.preview.title, description: ed.preview.description, site: ed.preview.site };
      let img = null;
      if (!ed.shot && !keepsImage && !ed.removeImage && ed.previewFor === u) {
        const b = await ed.previewImg.catch(() => null);
        if (b) img = await prepareImage(b);
      }
      return { meta, img };
    };
    try {
      if (isEdit) {
        const patch = { ...base, note: ed.kind === "note" ? ed.noteInput.value.trim() : why };
        const meta = { ...metaOf(item) };
        let fetchedImg = null;
        if (ed.kind === "instagram") {
          const p = igPermalink(ed.igInput.value); if (!p) throw new Error("That doesn't look like an Instagram post link. It should contain /p/ or /reel/.");
          patch.url = p;
          if (ed.coverCb.checked) {
            if (!ed.shot && (ed.removeImage || !item.image_path)) throw new Error("Add a screenshot to use as the cover, or untick the cover box.");
            meta.cover = "shot";
          } else delete meta.cover;
        }
        if (ed.kind === "link") {
          const u = normUrl(ed.urlInput.value); if (!u) throw new Error("Add a valid web address.");
          patch.url = u;
          const x = await linkExtras(u, !!item.image_path);
          Object.assign(meta, x.meta); fetchedImg = x.img;
          if (u !== item.url && !x.meta.preview) delete meta.preview;
        }
        if (ed.kind === "note" && !patch.note) throw new Error("The note is empty.");
        if (ed.kind === "palette" && ed.palette) meta.palette = ed.palette.data;
        const newImg = ed.kind === "sketch" ? ed.sketch : ed.kind === "palette" ? ed.palette : (ed.shot || fetchedImg);
        if (newImg) patch.image_path = await up(newImg);
        else if (ed.removeImage) { if (ed.kind === "image") throw new Error("A photo card needs an image. Add one, or delete the card."); patch.image_path = null; }
        Object.assign(patch, extras({ meta: withRooms(meta) }));
        await st.updateItem(item.id, patch);
        if ("image_path" in patch && item.image_path && patch.image_path !== item.image_path) st.removeFile(item.image_path);

      } else {

        const mk = (extra, k) => ({ ...base, note: why, ...extra, created_at: new Date(now - k).toISOString() });
        if (ed.kind === "instagram") {
          const raw = ed.igInput.value.split(/[\s,]+/).filter(Boolean);
          const all = [...new Set(raw.map(igPermalink).filter(Boolean))];
          if (!all.length) throw new Error("Paste an Instagram post link. It should contain /p/ or /reel/.");
          const have = new Set(S.items.filter(i => i.kind === "instagram").map(i => igPermalink(i.url)));
          const links = all.filter(u => !have.has(u));
          if (!links.length) throw new Error(all.length === 1 ? "That post is already on the board." : "All of these posts are already on the board.");
          const skipped = raw.filter(r => !igPermalink(r)).length, dupes = all.length - links.length;
          const useCover = links.length === 1 && ed.coverCb.checked;

          const shotPath = links.length === 1 ? await up(ed.shot) : null;
          links.forEach((u, k) => rows.push(mk({ kind: "instagram", url: u, image_path: shotPath, ...extras({ meta: useCover ? { cover: "shot" } : {} }) }, k)));
          const notes = [skipped && `${skipped} link${skipped === 1 ? " wasn't an Instagram post" : "s weren't Instagram posts"}`, dupes && `${dupes} already on the board`].filter(Boolean);
          if (notes.length) setTimeout(() => toast("Skipped: " + notes.join(", ")), 1200);
        } else if (ed.kind === "image") {

        } else if (ed.kind === "palette") {

          rows.push(mk({ kind: "sketch", title: base.title || "Colour palette", image_path: await up(ed.palette), ...extras({ meta: { palette: ed.palette.data } }) }, 0));
        } else if (ed.kind === "link") {

          const x = await linkExtras(u, false);

        } else {
          const n = ed.noteInput.value.trim(); if (!n) throw new Error("The note is empty.");
          rows.push(mk({ kind: "note", note: n }, 0));
        }
        if ((rooms.length > 1 || spot || fCur.checked) && !S.needsUpdate) rows.forEach(r => { r.meta = withRooms(r.meta || {}); });
        await st.insertItems(rows);
        const hiddenNow = !fCur.checked && curMode(S.filter) === "curated";
        toast((rows.length === 1 ? "Added to the board" : `Added ${rows.length} items`) + (hiddenNow ? (rows.length === 1 ? ". Find it under “Not yet curated”." : ". Find them under “Not yet curated”.") : ""));
      }
      closeOverlay("editor");
      await refresh();
    } catch (e) {
      toast(errMsg(e), "err");
      saveBtn.disabled = false; saveBtn.textContent = saveLabel;
    }
  }

  setKind(ed.kind);
  if (files?.length && ed.onFiles) ed.onFiles(ed.kind === "image" ? files : files.slice(0, 1));
  if (text) { if (ed.kind === "instagram") ed.igInput.value = text.trim(); else if (ed.kind === "link") { ed.urlInput.value = text.trim(); ed.loadPv(); } }
  setTimeout(() => (kindBox.querySelector("textarea, input:not([type=file])") || fTitle).focus(), 40);
}

      onclick: () => { sizeIx = i; sync(); } }, el("span", { style: `width:${4 + i * 5}px;height:${4 + i * 5}px` })));

      el("div", { class: "sk-group" }, ...toolBtns),

      el("div", { class: "spacer" }),

    if (d[i + 3] < 200) continue;
    const k = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
    const b = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 }; b.n++; b.r += d[i]; b.g += d[i + 1]; b.b += d[i + 2]; buckets.set(k, b);
  }
  const out = [];
  for (const b of [...buckets.values()].sort((p, q) => q.n - p.n)) {
    const rgb = [b.r / b.n, b.g / b.n, b.b / b.n].map(Math.round);
    if (out.some(o => Math.hypot(o[0] - rgb[0], o[1] - rgb[1], o[2] - rgb[2]) < 42)) continue;
    out.push(rgb); if (out.length >= n) break;
  }
  return out.map(rgb => "#" + rgb.map(v => v.toString(16).padStart(2, "0")).join(""));
}

/* Opens the palette tool. Resolves to { data, blob, ext, preview } or null if cancelled. */
function openPalette(initial) {
  return new Promise(resolve => {
    S.stack.push("palette"); document.body.classList.add("locked");
    const start = initial?.parts ? initial : { parts: PAL_PRESETS[0][2], floor: PAL_PRESETS[0][1] };
    const parts = { ...PAL_PRESETS[0][2], ...start.parts };
    let floor = start.floor || "plain", sel = "wall", photoIx = -1, photoCols = [];
    const stage = el("div", { class: "pal-stage" });
    const side = el("div", { class: "pal-side" });
    const preset = el("select", { "aria-label": "Start from a ready-made palette", onchange: e => {
      const p = PAL_PRESETS[+e.target.value]; if (p) { Object.assign(parts, p[2]); floor = p[1]; draw(); } e.target.value = ""; } },
      el("option", { value: "" }, "Start from…"), ...PAL_PRESETS.map(([n], i) => el("option", { value: String(i) }, n)));
    const floorSeg = el("div", { class: "seg", role: "group", "aria-label": "Floor finish" },

    const finish = v => {
      ov.remove(); S.stack = S.stack.filter(n => n !== "palette");
      if (!S.stack.length) document.body.classList.remove("locked");
      resolve(v);
    };
    const cancel = el("button", { type: "button", class: "btn ghost", onclick: () => finish(null) }, "Cancel");
    const use = el("button", { type: "button", class: "btn primary", onclick: async () => {
      use.disabled = true;
      try {
        const blob = await svgToPng(paletteSVG(parts, floor, { swatches: true }));
        finish({ data: { parts: { ...parts }, floor }, blob, ext: "png", preview: URL.createObjectURL(blob) });
      } catch { toast("Couldn't create the palette image.", "err"); use.disabled = false; }
    } }, "Use palette");
    const ov = el("div", { class: "pal", role: "dialog", "aria-modal": "true", "aria-label": "Colour palette" },
      el("div", { class: "sk-bar" }, el("strong", {}, "Colour palette"), preset, floorSeg, el("span", { class: "spacer" }), cancel, use),
      el("div", { class: "pal-body" }, stage, side));
    stage.addEventListener("click", e => { const k = e.target.closest("[data-part]")?.dataset.part; if (k) { sel = k; draw(); } });

    const boardPhotos = () => {
      const pool = S.boardItems.filter(i => i.image_path && S.urls.get(i.image_path) && !metaOf(i).palette &&
        (S.filter.room === "all" || inRoom(i, S.filter.room === "none" ? null : S.filter.room)));
      return pool.slice(0, 12);
    };
    function setColour(hex) { parts[sel] = okHex(hex); draw(); }
    function draw() {
      stage.innerHTML = paletteSVG(parts, floor, { selected: sel });
      floorSeg.querySelectorAll(".seg-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === floor)));
      const cur = okHex(parts[sel]);
      const swatch = hex => el("button", { type: "button", style: `background:${hex}`, title: PAL_NAME[hex] || hex.toUpperCase(),
        "aria-label": PAL_NAME[hex] || hex, "aria-pressed": String(hex === cur), onclick: () => setColour(hex) });
      const custom = el("input", { type: "color", value: cur, "aria-label": "Any colour", oninput: e => { parts[sel] = okHex(e.target.value); stage.innerHTML = paletteSVG(parts, floor, { selected: sel }); }, onchange: () => draw() });

        el("section", {}, el("h3", {}, "Colour for " + PAL_PARTS.find(p => p[0] === sel)[1].split(":")[0].toLowerCase()),
          el("div", { class: "sw-grid" }, ...PAL_COLOURS.map(([h]) => swatch(h))),

        el("section", {}, el("h3", {}, "Colours from the board"),

/* ---------- Import a prepared bundle (JSON with items and embedded images) ---------- */
async function importBundle() {
  const [f] = await pickFile(".json,application/json"); if (!f) return;
  let b;
  try { b = JSON.parse(await f.text()); } catch { toast("That file isn't a board import file.", "err"); return; }
  if (b?.format !== "home-moodboard-import" || !Array.isArray(b.items)) { toast("That file isn't a board import file.", "err"); return; }
  const done = new Set(S.items.map(i => metaOf(i).import_id).filter(Boolean));
  const todo = b.items.filter(x => !done.has(x.id));
  // Documents in the file go to the Documents section; one with the same name is already there is skipped.
  const haveDocs = new Set(S.docs.map(d => d.name));
  const docs = (Array.isArray(b.documents) ? b.documents : []).filter(d => d && d.name && d.data && !haveDocs.has(d.name));
  // An interactive floor plan: a drawing plus its clickable rooms and furniture, saved privately for this board.
  const plan = b.plan && b.plan.image && b.plan.data && S.settings["plan:layout"]?.import_id !== b.plan.id ? b.plan : null;
  const roomByName = n => S.rooms.find(r => r.name.trim().toLowerCase() === String(n).trim().toLowerCase());
  const namesOf = x => (Array.isArray(x.rooms) && x.rooms.length ? x.rooms : x.room ? [x.room] : []);
  const newRooms = [...new Set(todo.flatMap(namesOf).filter(n => n && !roomByName(n)))];
  const perRoom = new Map(); todo.forEach(x => perRoom.set(x.room || "Whole home", (perRoom.get(x.room || "Whole home") || 0) + 1));
  const parts = [todo.length && `${todo.length} item${todo.length === 1 ? "" : "s"}`, docs.length && `${docs.length} document${docs.length === 1 ? "" : "s"}`, plan && "the floor plan"].filter(Boolean);
  const go = el("button", { type: "button", class: "btn primary", disabled: !parts.length || null }, parts.length ? "Import " + parts.join(", ") : "Import");
  const status = el("p", { class: "hint", "aria-live": "polite" });
  openOverlay("import", el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": "Import" },
    panelHead("Import: " + (b.source || f.name), () => closeOverlay("import")),
    el("div", { class: "panel-body" },
      plan ? el("p", {}, "Floor plan: " + (b.plan.data.name || "interactive plan") + (S.settings["plan:layout"] ? " (replaces the current one)" : "") + ". It opens under Plan, next to Board, Feed and By room.") : null,
      docs.length ? el("p", {}, "Documents: " + docs.map(d => d.name).join(", ")) : null,
      todo.length ? el("p", {}, `This adds ${todo.length} card${todo.length === 1 ? "" : "s"} to the board${done.size && todo.length < b.items.length ? ` (${b.items.length - todo.length} were imported before and are skipped)` : ""}:`)
        : docs.length || plan ? null : el("p", {}, "Everything in this file is already on the board."),
      el("ul", {}, ...[...perRoom].map(([r, n]) => el("li", {}, `${r}: ${n}`))),
      newRooms.length ? el("p", {}, "New rooms will be created: " + newRooms.join(", ") + ".") : null,
      el("p", { class: "hint" }, "Imported cards are normal cards: edit, move or delete them afterwards. Running the same file again won't add duplicates."),
      status,
      el("div", { class: "form-actions" }, el("button", { type: "button", class: "btn ghost", onclick: () => closeOverlay("import") }, "Cancel"), go))));
  go.addEventListener("click", async () => {
    go.disabled = true;
    try {
      for (const n of newRooms) await S.store.addRoom(n);
      S.rooms = await S.store.rooms();
      if (plan) {
        if (S.needsUpdate) throw new Error("Run update-2.sql in Supabase first (see the banner at the top).");
        status.textContent = "Adding the floor plan…";
        const blob = await (await fetch(plan.image)).blob();
        const old = S.settings["plan:layout"]?.image_path;
        const image_path = await S.store.upload(blob, (blob.type.split("/")[1] || "png").replace("jpeg", "jpg"));
        const value = { ...plan.data, image_path, import_id: plan.id };
        await S.store.setSetting("plan:layout", value);
        S.settings["plan:layout"] = value;
        if (old && old !== image_path) S.store.removeFile(old);
      }
      for (const d of docs) {
        status.textContent = `Uploading ${d.name}…`;
        const blob = await (await fetch(d.data)).blob();
        const file = new File([blob], d.name, { type: d.mime || blob.type || "application/octet-stream" });
        const path = await S.store.uploadFile(file);
        await S.store.addDocument({ name: d.name, path, size: file.size, mime: file.type || null, note: d.note || "",
          room_id: d.room ? roomByName(d.room)?.id || null : null });
      }
      let k = 0;
      for (const x of todo) {
        status.textContent = `Adding ${++k} of ${todo.length}: ${x.title || x.kind}…`;
        const ids = namesOf(x).map(n => roomByName(n)?.id).filter(Boolean);
        let image_path = null;
        if (x.image) {
          const blob = await (await fetch(x.image)).blob();
          const p = await prepareImage(blob);
          image_path = await S.store.upload(p.blob, p.ext);
        }
        await S.store.insertItems([{
          kind: x.kind, title: x.title || "", note: x.note || "", url: x.url || null, room_id: ids[0] || null,
          type: x.type || null, priority: ["must", "nice", "avoid"].includes(x.priority) ? x.priority : "nice", image_path,
          created_at: new Date(Date.now() - k * 1000).toISOString(),
          ...extras({ meta: { import_id: x.id, source: b.source || null, ...(ids.length > 1 ? { rooms: ids } : {}), ...(Array.isArray(x.spots) && x.spots.length ? { spots: x.spots } : {}) } }),
        }]);
      }
      closeOverlay("import"); toast("Imported " + parts.join(", ")); await refresh(); S.redrawSettings?.();
    } catch (e) { status.textContent = "Stopped: " + errMsg(e) + " Run the import again to add the rest."; toast(errMsg(e), "err"); go.disabled = false; }
  });
}

/* ===================== FLOOR PLAN ===================== */

function updatePlanZones() {
  const box = $("#plan-box"); if (!box) return;
  const f = S.filter, anyRoom = { ...f, room: "all" };
  const counts = new Map();
  for (const it of S.boardItems) if (matchesWith(it, anyRoom)) roomsOf(it).forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
  const filtering = f.type !== "all" || f.prio !== "all" || !!f.q || f.newOnly;
  box.querySelectorAll(".zone").forEach(z => {
    const id = z.dataset.room, n = counts.get(id) || 0, on = f.room === id;
    z.classList.toggle("on", on);
    z.setAttribute("aria-pressed", String(on));
    z.classList.toggle("has", filtering && n > 0 && !on);
    z.classList.toggle("none", !on && (filtering ? n === 0 : f.room !== "all"));
    const zc = z.querySelector(".zc"); if (zc) zc.textContent = " · " + n;
  });
}

    let why = null;
    if ((c.mentions || []).includes(me)) why = "tagged you";
    else if (c.parent_id && (byId.get(c.parent_id)?.author || "").toLowerCase() === me) why = "replied to you";
    else if ((S.byId.get(c.item_id)?.created_by || "").toLowerCase() === me) why = "commented on your post";
    if (why && S.byId.has(c.item_id)) out.push({ c, why });
  }
  return out.sort((a, b) => Date.parse(b.c.created_at) - Date.parse(a.c.created_at));
}
const seenKey = () => "mb-fy-seen:" + myEmail();
function updateForYou() {
  const b = $("#fy-badge"); if (!b) return;
  const seen = +lsGet(seenKey()) || 0;
  const n = forYouList().filter(x => Date.parse(x.c.created_at) > seen).length;
  b.hidden = !n; b.textContent = n > 99 ? "99+" : String(n);
}
function openForYou() {
  const seen = +lsGet(seenKey()) || 0;
  const list = forYouList();
  lsSet(seenKey(), String(Date.now()));
  updateForYou();
  openOverlay("foryou", el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": "For you" },
    panelHead("For you", () => closeOverlay("foryou")),
    el("div", { class: "panel-body" },
      el("p", { class: "hint" }, "Comments that tag you, replies to your comments, and comments on things you added."),
      list.length ? el("div", { class: "fy" }, ...list.slice(0, 100).map(({ c, why }) => el("button", { type: "button", class: "fy-row" + (Date.parse(c.created_at) > seen ? " unread" : ""),
        onclick: () => { closeOverlay("foryou"); openDetail(c.item_id); } },
        el("div", { class: "c-head" }, el("strong", {}, `${nameOf(c.author)} ${why}`), el("span", {}, fmtWhen(c.created_at))),
        el("div", { class: "hint" }, "on " + titleOf(S.byId.get(c.item_id))),
        c.body ? el("div", { class: "c-body" }, ...richBody(c.body)) : null,
        c.audio_path ? el("div", { class: "hint" }, "🎤 Voice note") : null)))
        : el("p", {}, "Nothing yet. When someone tags you with @ or replies to you, it shows up here."))));
}

/* ===================== DOCUMENTS ===================== */
const DOC_KINDS = [[/\.pdf$/i, "PDF", "pdf"], [/\.(dwg|dxf|skp|rvt|ifc|3dm|3ds|max)$/i, "CAD", "cad"], [/\.(xlsx?|csv|numbers|ods)$/i, "XLS", "sheet"],
  [/\.(docx?|pages|odt|rtf|txt|md)$/i, "DOC", "word"], [/\.(pptx?|key|odp)$/i, "PPT", "word"], [/\.(zip|rar|7z)$/i, "ZIP", ""],
  [/\.(png|jpe?g|webp|gif|heic|heif|avif|svg)$/i, "IMG", "img"]];
function docKind(d) {
  for (const [re, label, cls] of DOC_KINDS) if (re.test(d.name || "")) return { label, cls };
  if (/^image\//.test(d.mime || "")) return { label: "IMG", cls: "img" };
  const ext = ((d.name || "").match(/\.(\w{1,5})$/) || [])[1];
  return { label: ext ? ext.toUpperCase() : "FILE", cls: "" };
}
/* Demo mode keeps files as data: URLs, which browsers won't open in a new tab directly. */
function openDocLink(e) {
  const doc = e.currentTarget.dataset.doc;
  if (doc) sendCheckIn(true, { doc });   // logged for the board owner's history
  const href = e.currentTarget.getAttribute("href") || "";
  if (!href.startsWith("data:")) return;
  e.preventDefault();
  fetch(href).then(r => r.blob()).then(b => window.open(URL.createObjectURL(b), "_blank"));
}
function renderDocs() {
  const sec = $("#docs-sec"); if (!sec) return;
  const nn = $("#n-docs-n"); if (nn) nn.textContent = S.docs.length ? String(S.docs.length) : "";
  if (S.section !== "docs") return;
  if (!sec.dataset.built) {
    sec.dataset.built = "1";
    const q = el("input", { type: "search", id: "d-q", placeholder: "Search file names and notes", "aria-label": "Search documents",
      oninput: debounce(e => { S.docFilter.q = e.target.value.trim().toLowerCase(); drawDocList(); }, 150) });
    const room = el("select", { id: "d-room", "aria-label": "Filter documents by room", onchange: e => { S.docFilter.room = e.target.value; drawDocList(); } });
    const drop = el("div", { class: "drop", tabindex: "0", role: "button", onclick: () => uploadDocs(),
      onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); uploadDocs(); } },
      ondragover: e => { e.preventDefault(); drop.classList.add("over"); },
      ondragleave: () => drop.classList.remove("over"),
      ondrop: e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove("over"); const fs = [...e.dataTransfer.files]; if (fs.length) uploadDocs(fs); } },
      el("strong", {}, "Drop files here, or click to upload"),
      el("span", { class: "hint" }, "Drawings, PDFs, quotes, spreadsheets, CAD files, photos: anything up to 50 MB each. Everyone on the board can open, rename and delete them."));
    sec.replaceChildren(
      el("div", { class: "docs-bar" }, q, room, el("span", { class: "count", id: "d-count" })),
      drop,
      el("div", { class: "doc-list", id: "doc-list" }));
  }
  const room = $("#d-room"), cur = S.docFilter.room;
  room.replaceChildren(el("option", { value: "all" }, "All rooms"), ...S.rooms.map(r => el("option", { value: r.id }, r.name)), el("option", { value: "none" }, "Whole home"));
  room.value = cur; if (room.value !== cur) { S.docFilter.room = "all"; room.value = "all"; }
  drawDocList();
}
function drawDocList() {
  const listEl = $("#doc-list"); if (!listEl) return;
  const f = S.docFilter, roomIds = new Set(S.rooms.map(r => r.id));
  const list = S.docs.filter(d => {
    if (f.room === "none" ? (d.room_id && roomIds.has(d.room_id)) : (f.room !== "all" && d.room_id !== f.room)) return false;
    if (f.q && ![d.name, d.note, roomName(d.room_id), nameOf(d.uploaded_by)].join(" ").toLowerCase().includes(f.q)) return false;
    return true;
  });
  $("#d-count").textContent = list.length === S.docs.length ? `${S.docs.length} file${S.docs.length === 1 ? "" : "s"}` : `${list.length} of ${S.docs.length}`;
  listEl.replaceChildren(...(list.length ? list.map(docRow)
    : [el("p", { class: "hint", style: "text-align:center;padding:24px" }, S.docs.length ? "No documents match." : "No documents yet. Upload the first one above.")]));
}
function docRow(d) {
  const url = S.urls.get(d.path) || null, k = docKind(d);
  const link = (cls, ...kids) => el("a", { class: cls, href: url || "#", target: "_blank", rel: "noopener", "data-doc": d.id, onclick: openDocLink }, ...kids);
  const icon = link("doc-ic " + k.cls, k.cls === "img" && url ? el("img", { src: url, alt: "", loading: "lazy" }) : k.label);
  icon.setAttribute("aria-hidden", "true"); icon.tabIndex = -1;
  return el("div", { class: "doc" }, icon,
    el("div", { class: "doc-main" },
      link("doc-name", d.name),
      el("div", { class: "doc-meta" }, [roomName(d.room_id), nameOf(d.uploaded_by), fmtDate(d.created_at), fmtSize(d.size)].filter(Boolean).join(" · ")),
      d.note ? el("div", { class: "doc-note" }, d.note) : null),
    el("div", { class: "doc-acts" },
      el("button", { type: "button", class: "btn small", onclick: () => openDocEditor(d) }, "Edit"),
      confirmBtn("Delete", "Delete for everyone?", async () => { await S.store.deleteDocument(d); toast("Deleted"); await refresh(); }, "small ghost")));
}
async function uploadDocs(files) {
  if (!files) files = await pickFile(null, true);
  if (!files?.length) return;
  if (S.needsUpdate) { toast("Run update-2.sql in Supabase first (see the banner at the top).", "err"); return; }
  const room = !["all", "none"].includes(S.docFilter.room) ? S.docFilter.room : null;
  const failed = []; let ok = 0;
  for (const [i, f] of files.entries()) {
    if (f.size > 50 * 1024 * 1024) { failed.push(`${f.name} (over 50 MB)`); continue; }
    toast(files.length > 1 ? `Uploading ${i + 1} of ${files.length}: ${f.name}` : `Uploading ${f.name}…`);
    try {
      const path = await S.store.uploadFile(f);
      await S.store.addDocument({ name: f.name, path, size: f.size, mime: f.type || null, room_id: room });
      ok++;
    } catch (e) { failed.push(`${f.name} (${errMsg(e)})`); }
  }
  if (ok) await refresh();
  if (failed.length) toast(`Couldn't upload: ${failed.join(", ")}`, "err");
  else if (ok) toast(`Uploaded ${ok} file${ok === 1 ? "" : "s"}`);
}
function openDocEditor(d) {
  const name = el("input", { id: "doc-name", value: d.name, required: true });
  const room = el("select", { id: "doc-room" }, el("option", { value: "" }, "Whole home"), ...S.rooms.map(r => el("option", { value: r.id }, r.name)));
  room.value = d.room_id || "";
  const note = el("textarea", { id: "doc-note", rows: 3, placeholder: "What is it? e.g. “Revised kitchen elevation, 12 Nov”" }); note.value = d.note || "";
  const save = el("button", { class: "btn primary", type: "submit" }, "Save");
  openOverlay("doc-editor", el("div", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": "Edit document" },
    panelHead("Edit document", () => closeOverlay("doc-editor")),
    el("form", { class: "panel-body", onsubmit: async e => {
      e.preventDefault(); save.disabled = true;
      try {
        await S.store.updateDocument(d.id, { name: name.value.trim() || d.name, room_id: room.value || null, note: note.value.trim() });
        closeOverlay("doc-editor"); toast("Saved"); await refresh();
      } catch (err) { toast(errMsg(err), "err"); save.disabled = false; }
    } }, field("Name", name), field("Room", room), field("Note", note),
      el("div", { class: "form-actions" }, el("button", { type: "button", class: "btn ghost", onclick: () => closeOverlay("doc-editor") }, "Cancel"), save))));
  setTimeout(() => name.focus(), 40);
}

/* ---------- shared from another app (Android share menu, iPhone Shortcut) ----------
   Arrives as ?add=… (Shortcut) or ?url=/text=/title= (Android share target). Kept in localStorage so it survives signing in. */
function takeShared() {
  const p = new URLSearchParams(location.search);
  const raw = ["add", "url", "text", "title"].map(k => p.get(k)).filter(Boolean).join(" ");
  if (!raw) return;
  history.replaceState(null, "", location.pathname + location.hash);
  lsSet("mb-shared", JSON.stringify({ raw, t: Date.now() }));
}
function openShared() {
  let s = null; try { s = JSON.parse(lsGet("mb-shared") || "null"); } catch {}
  if (!s) return;
  try { localStorage.removeItem("mb-shared"); } catch {}
  if (Date.now() - s.t > 30 * 60e3) return;
  const url = (String(s.raw).match(/https?:\/\/[^\s"'<>]+/) || [])[0];
  if (!url) { toast("That share didn't include a link, so there's nothing to add.", "err"); return; }
  if (S.section !== "board") setSection("board");
  openEditor({ kind: igPermalink(url) ? "instagram" : "link", text: url });
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- paste and drop anywhere ---------- */
document.addEventListener("paste", e => {
  if (!S.ready) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  const text = e.clipboardData?.getData("text") || "";
  const top = S.stack[S.stack.length - 1];
  if (top === "editor") {
    if (files.length && S.ed?.onFiles) { e.preventDefault(); S.ed.onFiles(S.ed.kind === "image" ? files : files.slice(0, 1)); }
    return;
  }
  if (top) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if (S.section === "docs") {
    const any = [...(e.clipboardData?.files || [])];
    if (any.length) { e.preventDefault(); uploadDocs(any); }
    return;
  }
  if (files.length) { e.preventDefault(); openEditor({ kind: "image", files }); }
  else if (igPermalink(text)) { e.preventDefault(); openEditor({ kind: "instagram", text }); }
  else if (/^https?:\/\/\S+$/i.test(text.trim())) { e.preventDefault(); openEditor({ kind: "link", text }); }
});
window.addEventListener("dragover", e => { if (e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });
window.addEventListener("drop", e => {
  const all = [...(e.dataTransfer?.files || [])];
  if (!all.length) return;
  e.preventDefault();
  if (!S.ready || S.stack.length) return;
  if (S.section === "docs") { uploadDocs(all); return; }
  const files = all.filter(f => f.type.startsWith("image/"));
  if (files.length) openEditor({ kind: "image", files });
  else toast("Only images go on the board. Put other files under Documents.");
});

takeShared();
boot();
</script>
